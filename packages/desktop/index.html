<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>El Code</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #202020;
      }
      #loading-overlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #202020;
        transition: opacity 200ms ease-out;
      }
      #loading-overlay.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .loading-icon {
        width: 64px;
        height: 64px;
        will-change: transform;
        animation: breathe 2s cubic-bezier(.4, 0, .2, 1) infinite;
      }
      @keyframes breathe {
        0%, 100% { transform: scale(0.96); opacity: 0.75; }
        50% { transform: scale(1); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="loading-overlay">
      <svg class="loading-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M65 25 C65 25 75 25 75 35 L75 65 C75 75 65 75 65 75 M65 45 C65 45 55 45 55 55 C55 65 65 65 65 65 M35 25 C35 25 25 25 25 35 L25 65 C25 75 35 75 35 75 M35 45 C35 45 45 45 45 35" stroke="white" stroke-width="8" stroke-linecap="round" fill="none"/>
      </svg>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/renderer/main.ts"></script>
  </body>
</html>
