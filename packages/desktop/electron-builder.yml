appId: com.elcode.desktop
productName: Elcode
npmRebuild: false
directories:
  buildResources: build
  output: release
files:
  - dist/**/*
  - build/**/*
extraResources:
  - from: "../core/dist/@model-agent/core-windows-x64/bin/elcode.exe"
    to: "backend/elcode.exe"
mac:
  icon: build/icon.png
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
win:
  icon: build/icon.ico
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Elcode
linux:
  icon: build/icon.png
  target:
    - AppImage
    - deb