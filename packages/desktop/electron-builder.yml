appId: com.opencode.desktop
productName: OpenCode Desktop
directories:
  buildResources: build
  output: release_new
files:
  - dist/**/*
  - build/**/*
# Include compiled core backend executable (path is relative to packages/desktop)
extraResources:
  - from: "../../dist/opencode-windows-x64/bin/opencode.exe"
    to: "backend/opencode.exe"
mac:
  icon: build/icon.png
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
win:
  icon: build/icon.ico
  target:
    - nsis
    - portable
linux:
  icon: build/icon.png
  target:
    - AppImage
    - deb