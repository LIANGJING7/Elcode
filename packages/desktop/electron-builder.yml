appId: com.elcode.desktop
productName: Elcode
directories:
  buildResources: build
  output: release_new
files:
  - dist/**/*
  - build/**/*
# Include compiled core backend executable (path is relative to packages/desktop)
extraResources:
  - from: "../core/dist/@model-agent/core-windows-x64/bin/elcode.exe"
    to: "backend/elcode.exe"
mac:
  icon: build/icon.png
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
win:
  icon: build/icon.ico
  target:
    - nsis
    - portable
linux:
  icon: build/icon.png
  target:
    - AppImage
    - deb