<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LCode - 启动失败</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      -webkit-app-region: no-drag;
      background: #1a1a1a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    
    .error-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #f5f5f5;
    }
    
    .error-icon {
      width: 64px;
      height: 64px;
      margin-bottom: 24px;
    }
    
    .error-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #ff6b6b;
    }
    
    .error-message {
      font-size: 14px;
      color: #888;
      max-width: 400px;
      text-align: center;
      margin-bottom: 32px;
      line-height: 1.5;
    }
    
    .retry-button {
      padding: 12px 24px;
      background: #3a3a3a;
      border: none;
      border-radius: 8px;
      color: #f5f5f5;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .retry-button:hover {
      background: #4a4a4a;
    }
    
    .retry-button:active {
      background: #2a2a2a;
    }
  </style>
</head>
<body>
  <div class="error-container">
    <svg class="error-icon" viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="12" r="10" stroke="#ff6b6b" stroke-width="2" fill="none"/>
      <line x1="12" y1="8" x2="12" y2="12" stroke="#ff6b6b" stroke-width="2" stroke-linecap="round"/>
      <circle cx="12" cy="16" r="1" fill="#ff6b6b"/>
    </svg>
    <div class="error-title">启动失败</div>
    <div class="error-message" id="message">
      后端服务启动超时，请检查日志或重启应用。
    </div>
    <button class="retry-button" id="retry">重新启动</button>
  </div>
  <script>
    const messageEl = document.getElementById('message');
    const retryBtn = document.getElementById('retry');
    
    // 从 URL 参数获取错误信息
    const params = new URLSearchParams(window.location.search);
    const error = params.get('error');
    if (error) {
      messageEl.textContent = error;
    }
    
    retryBtn.addEventListener('click', () => {
      // 通知主进程重试
      if (window.desktop && window.desktop.retryStartup) {
        window.desktop.retryStartup();
      }
    });
  </script>
</body>
</html>
